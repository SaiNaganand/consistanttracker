<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Consistency Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--ink:#13222c;--mute:#5d6f7a;--line:#d5dee3;--acc:#0e7c6b;--card:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif}
form{width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px}
h1{margin:0 0 4px;font-size:26px;font-weight:700}p{margin:0 0 24px;color:var(--mute)}
label{display:block;font-weight:500;font-size:14px;margin:14px 0 6px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:600 16px Outfit,sans-serif;cursor:pointer}
button:hover{background:#0b6759}.err{margin-top:14px;color:#b3261e;font-size:14px}
</style></head><body>
<form method="post" autocomplete="off">
<h1>Consistency Tracker</h1><p>Sign in to see today's check-ins.</p>
<label for="u">Username</label><input id="u" name="username" required autofocus>
<label for="p">Password</label><input id="p" name="password" type="password" required>
<button type="submit">Sign in</button>
{% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
</form></body></html>
