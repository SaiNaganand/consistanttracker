<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consistency Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#13222c;--mute:#5d6f7a;--line:#d5dee3;--acc:#0e7c6b;--accl:#d6efe9;--miss:#f2c9c2;--warn:#b3261e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;line-height:1.45}
header{display:flex;justify-content:space-between;align-items:center;max-width:1040px;margin:0 auto;padding:20px 20px 8px}
header h1{margin:0;font-size:24px}header a{color:var(--mute);text-decoration:none;font-size:14px;border:1px solid var(--line);padding:6px 12px;border-radius:8px;background:#fff}
main{max-width:1040px;margin:0 auto;padding:12px 20px 60px;display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.summary{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.ring{position:relative;width:150px;height:150px}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:700}
.ring small{display:block;font-size:12px;font-weight:400;color:var(--mute);text-align:center;margin-top:-26px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.stat{padding:12px 14px;border-radius:10px;background:var(--bg)}.stat b{display:block;font-size:24px}.stat span{font-size:13px;color:var(--mute)}
h2{margin:0 0 12px;font-size:17px}
.weeks{display:flex;align-items:flex-end;gap:10px;height:120px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mute)}
.wk i{display:block;width:100%;max-width:46px;background:var(--acc);border-radius:5px 5px 0 0;min-height:3px}.wk i.none{background:var(--line)}
.wk em{font-style:normal;color:var(--ink);font-weight:600;margin-bottom:3px}
form.add{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
form.add .full{grid-column:1/-1}
label{font-size:13px;font-weight:500;display:block;margin-bottom:5px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:600 15px Outfit,sans-serif;border:0;border-radius:8px;padding:10px 18px;background:var(--acc);color:#fff;cursor:pointer}
button:hover{background:#0b6759}button.ghost{background:#fff;color:var(--mute);border:1px solid var(--line)}button.ghost:hover{background:var(--bg)}
button.danger{color:var(--warn)}
.msg{color:var(--warn);font-size:14px;min-height:20px}
.task-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.task-head h3{margin:0;font-size:19px}.meta{color:var(--mute);font-size:13px}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--accl);color:#0a5a4d;font-weight:600}
.pill.completed{background:#e4e8ea;color:var(--mute)}.pill.upcoming{background:#fdf0d5;color:#8a5a00}
.bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;margin:14px 0 6px}.bar i{display:block;height:100%;background:var(--acc)}
.tstats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px;margin-bottom:14px}.tstats b{font-weight:700}
.month{font-size:12px;color:var(--mute);margin:10px 0 5px;font-weight:500}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.day{position:relative}.day input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.day span{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);font-size:13px;background:#fff;color:var(--mute)}
.day input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.day input:checked+span::after{content:"";}
.day.missed span{background:var(--miss);border-color:#e6aea5;color:#7a2a20}
.day.today span{box-shadow:0 0 0 2px var(--ink)}
.day.future span{opacity:.45}.day.future input{cursor:not-allowed}
.day input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;font-weight:600;font-size:14px}
.note{padding:9px 12px;background:var(--bg);border-radius:8px;margin-top:8px;font-size:14px;white-space:pre-wrap;word-break:break-word}.note small{display:block;color:var(--mute);font-size:12px}
.addnote{display:flex;gap:8px;margin-top:10px}.addnote textarea{height:44px;resize:vertical}
.empty{text-align:center;color:var(--mute);padding:34px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:12px;flex-wrap:wrap}.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.l1::before{background:var(--acc)!important;border-color:var(--acc)!important}.l2::before{background:var(--miss)!important}
@media(max-width:700px){.summary{grid-template-columns:1fr;justify-items:center}.stats{width:100%}form.add{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Consistency Tracker</h1><a href="/logout">Sign out</a></header>
<main>
 <section class="card summary" id="summary" aria-live="polite"></section>
 <section class="card"><h2>Weekly consistency (last 8 weeks)</h2><div class="weeks" id="weeks"></div></section>
 <section class="card">
  <h2>Add a task</h2>
  <form class="add" id="addForm">
   <div><label for="name">Task</label><input id="name" maxlength="120" required placeholder="e.g. Read 20 pages"></div>
   <div><label for="start">Start date</label><input id="start" type="date" required></div>
   <div><label for="target">Target date</label><input id="target" type="date" required></div>
   <div class="full"><label for="note">Note (optional)</label><input id="note" maxlength="500" placeholder="Why this matters, rules, reminders"></div>
   <div class="full" style="display:flex;gap:14px;align-items:center"><button type="submit">Add task</button><span class="msg" id="msg" role="alert"></span></div>
  </form>
 </section>
 <div id="tasks"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const open=new Set();
async function api(url,method='GET',body){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){location='/login';return}
  const j=await r.json();if(!r.ok)throw new Error(j.error||'Something went wrong');return j;
}
function ring(p){const r=62,c=2*Math.PI*r;return `<div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="#e3e9ec" stroke-width="12"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="#0e7c6b" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}"/></svg><b>${p}%</b></div>`}
function render(d){
  $('#summary').innerHTML=ring(d.overall_pct)+`<div><h2 style="margin-bottom:4px">Overall consistency</h2><div class="meta" style="margin-bottom:12px">Ticked days out of every day that has come due so far.</div><div class="stats">
   <div class="stat"><b>${d.today_done}/${d.active}</b><span>Done today</span></div>
   <div class="stat"><b>${d.active}</b><span>Active tasks</span></div>
   <div class="stat"><b>${d.completed}</b><span>Finished tasks</span></div>
   <div class="stat"><b>${d.best_streak}</b><span>Best streak (days)</span></div></div></div>`;
  $('#weeks').innerHTML=d.weeks.map(w=>`<div class="wk"><em>${w.has?w.pct+'%':'–'}</em><i class="${w.has?'':'none'}" style="height:${w.has?Math.max(w.pct,3):3}%"></i><span>${w.label}</span></div>`).join('');
  if(!d.tasks.length){$('#tasks').innerHTML='<div class="card empty">No tasks yet. Add your first one above and set a target date.</div>';return}
  $('#tasks').innerHTML=d.tasks.map(t=>task(t,d.today)).join('');
  document.querySelectorAll('details[data-id]').forEach(el=>el.open=open.has(el.dataset.id));
}
function task(t,today){
  let html='',m='';
  t.days.forEach(x=>{
    const dt=new Date(x.date+'T00:00:00'),mo=dt.toLocaleString('en',{month:'long',year:'numeric'});
    if(mo!==m){if(m)html+='</div>';html+=`<div class="month">${mo}</div><div class="grid">`;m=mo}
    const cls=['day',x.future?'future':'',x.date===today?'today':'',(!x.done&&!x.future&&x.date<today)?'missed':''].join(' ');
    html+=`<label class="${cls}" title="${dt.toDateString()}"><input type="checkbox" ${x.done?'checked':''} ${x.future?'disabled':''} data-t="${t.id}" data-d="${x.date}" aria-label="${dt.toDateString()}"><span>${dt.getDate()}</span></label>`;
  });
  html+='</div>';
  const notes=t.notes.map(n=>`<div class="note"><small>${esc(n.added)}</small>${esc(n.text)}</div>`).join('')||'<div class="meta" style="margin-top:8px">No notes yet.</div>';
  return `<section class="card" style="margin-bottom:18px"><div class="task-head"><div><h3>${esc(t.name)}</h3><div class="meta">${t.start} to ${t.target} · ${t.total_days} days</div></div>
   <div style="display:flex;gap:8px;align-items:center"><span class="pill ${t.status}">${t.status==='active'?t.days_left+' days left':t.status}</span><button class="ghost danger" data-del="${t.id}">Delete</button></div></div>
   <div class="bar"><i style="width:${t.progress_pct}%"></i></div>
   <div class="tstats"><span><b>${t.progress_pct}%</b> of plan done</span><span><b>${t.consistency_pct}%</b> consistency so far</span><span><b>${t.done}</b>/${t.total_days} ticked</span><span><b>${t.missed}</b> missed</span><span><b>${t.streak}</b> day streak (best ${t.longest})</span></div>
   ${html}<div class="legend"><span class="l1">Done</span><span class="l2">Missed</span><span>Open</span></div>
   <details data-id="${t.id}"><summary>Notes (${t.notes.length})</summary>${notes}
   <div class="addnote"><textarea maxlength="500" placeholder="Add a note" id="n-${t.id}" aria-label="Note"></textarea><button data-note="${t.id}">Save note</button></div></details></section>`;
}
async function load(){render(await api('/api/data'))}
document.addEventListener('toggle',e=>{const id=e.target.dataset&&e.target.dataset.id;if(id){e.target.open?open.add(id):open.delete(id)}},true);
document.addEventListener('change',async e=>{
  const c=e.target;if(!c.dataset.t)return;
  try{await api(`/api/tasks/${c.dataset.t}/toggle`,'POST',{date:c.dataset.d})}catch(err){alert(err.message)}
  load();
});
document.addEventListener('click',async e=>{
  const b=e.target;
  if(b.dataset.note){const ta=$('#n-'+b.dataset.note);try{await api(`/api/tasks/${b.dataset.note}/notes`,'POST',{note:ta.value});open.add(b.dataset.note);load()}catch(err){alert(err.message)}}
  if(b.dataset.del&&confirm('Delete this task and all its history?')){await api('/api/tasks/'+b.dataset.del,'DELETE');load()}
});
$('#addForm').addEventListener('submit',async e=>{
  e.preventDefault();$('#msg').textContent='';
  try{await api('/api/tasks','POST',{name:$('#name').value,start:$('#start').value,target:$('#target').value,note:$('#note').value});
   e.target.reset();$('#start').value=new Date().toLocaleDateString('en-CA');load()}catch(err){$('#msg').textContent=err.message}
});
$('#start').value=new Date().toLocaleDateString('en-CA');
load();
</script></body></html>
